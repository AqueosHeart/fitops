name: FitOps quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitops
          POSTGRES_DB: fitops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitops -d fitops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://fitops@127.0.0.1:5432/fitops_test?schema=public
      BETTER_AUTH_URL: http://127.0.0.1:3000
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Create ephemeral test credentials
        shell: bash
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "FITOPS_DEMO_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Generate Prisma client and apply migrations
        working-directory: web
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
      - name: Seed isolated fictional test database
        working-directory: web
        run: npm run prisma:seed
      - name: Verify database and run integration suites
        working-directory: web
        run: |
          npm run db:verify
          npm run test:auth-api
          npm run test:api-contract
          npm run test:constraints
          npm run test:race
      - name: Lint and type-check
        working-directory: web
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Audit all dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Build production app
        working-directory: web
        run: npm run build
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run critical journey and accessibility E2E
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
