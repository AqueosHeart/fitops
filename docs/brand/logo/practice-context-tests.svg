<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Practice Athletic Club context tests</title><desc id="description">Original evaluation tests of the current Practice Athletic Club logo candidate in signage, apparel, a social avatar, and a booking interface.</desc>
  <rect width="1600" height="1120" fill="#F2F0E8"/>
  <style>.eyebrow{font:600 16px Arial,sans-serif;letter-spacing:2.4px;fill:#5C6159}.title{font:700 28px Arial,sans-serif;fill:#111310}.body{font:400 17px Arial,sans-serif;fill:#5C6159}.ui{font:500 17px Arial,sans-serif;fill:#111310}.small{font:600 14px Arial,sans-serif;letter-spacing:.7px;fill:#5C6159}.white{fill:#F2F0E8}</style>
  <text x="80" y="78" class="eyebrow">PRACTICE ATHLETIC CLUB · IDENTITY CONTEXT TESTS</text><text x="80" y="124" class="title">Quiet Strength holds together outside the logo sheet.</text><line x1="80" y1="158" x2="1520" y2="158" stroke="#D7D4CA" stroke-width="2"/>
  <g transform="translate(80 210)"><text class="eyebrow">01 / SIGNAGE</text><rect x="0" y="32" width="680" height="340" rx="8" fill="#111310"/><rect x="40" y="74" width="600" height="256" rx="4" fill="#F2F0E8"/><image href="practice-primary-stacked.svg" x="205" y="105" width="270" height="152"/><rect x="40" y="300" width="600" height="30" fill="#C7F134"/><text x="0" y="410" class="body"><tspan x="0" dy="0">The full mark establishes the club at distance; the lime stays a</tspan><tspan x="0" dy="23">single measured accent.</tspan></text></g>
  <g transform="translate(840 210)"><text class="eyebrow">02 / APPAREL</text><rect x="0" y="32" width="680" height="340" rx="8" fill="#D7D4CA"/><path d="M180 90 L275 58 L340 106 L405 58 L500 90 L548 180 L480 212 L465 350 L215 350 L200 212 L132 180 Z" fill="#111310"/><image href="practice-primary-stacked-inverse.svg" x="270" y="147" width="140" height="78"/><text x="0" y="410" class="body"><tspan x="0" dy="0">The inverse wordmark reads cleanly on an Ink training layer</tspan><tspan x="0" dy="23">without turning the garment into merch noise.</tspan></text></g>
  <g transform="translate(80 680)"><text class="eyebrow">03 / SOCIAL AVATAR</text><rect x="0" y="32" width="680" height="340" rx="8" fill="#111310"/><circle cx="340" cy="190" r="116" fill="#F2F0E8"/><image href="practice-compact-mark.svg" x="274" y="124" width="132" height="132"/><text x="0" y="410" class="body"><tspan x="0" dy="0">The compact mark belongs in a repeated, already-recognized</tspan><tspan x="0" dy="23">icon context, not as the public-facing name.</tspan></text></g>
  <g transform="translate(840 680)"><text class="eyebrow">04 / BOOKING CONTEXT</text><rect x="0" y="32" width="680" height="340" rx="8" fill="#F2F0E8" stroke="#D7D4CA" stroke-width="2"/><rect x="0" y="32" width="680" height="72" rx="8" fill="#F2F0E8" stroke="#D7D4CA" stroke-width="2"/><image href="practice-horizontal-lockup.svg" x="28" y="39" width="240" height="60"/><text x="470" y="76" style="font:600 14px Arial,sans-serif;letter-spacing:.6px;fill:#111310">MY BOOKINGS</text><text x="32" y="146" class="small">TUESDAY · 6:30 PM</text><text x="32" y="184" class="title" style="font-size:24px">Strength Foundations</text><text x="32" y="216" class="ui">Coach Maya · 45 min · Studio A</text><rect x="32" y="244" width="138" height="34" rx="17" fill="#1F4D32"/><text x="56" y="266" class="white" style="font:600 13px Arial,sans-serif;letter-spacing:.6px">BOOKED</text><rect x="494" y="236" width="154" height="54" rx="4" fill="#C7F134"/><text x="525" y="269" style="font:700 16px Arial,sans-serif;fill:#111310">View booking</text><text x="0" y="410" class="body"><tspan x="0" dy="0">The horizontal lockup protects nav height; semantic roles</tspan><tspan x="0" dy="23">retain operational clarity.</tspan></text></g>
</svg>
